apiVersion: apps/v1
kind: Deployment
metadata:
  name: atomicip-api
  annotations:
    # Argo CD syncs this resource in wave 0, after config (-1) and before jobs (1).
    argocd.argoproj.io/sync-wave: "0"
spec:
  # replicas is owned by the HorizontalPodAutoscaler (#1067); leaving it unset
  # prevents Argo CD from fighting the autoscaler on every sync.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: atomicip-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: atomicip-api
      annotations:
        prometheus.io/scrape: "true"
        # Metrics are served on the internal metrics port (#1207), not the
        # public HTTP port.
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: atomicip-api
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-server
          image: ghcr.io/atomicip/api-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: atomicip-api-config
            - secretRef:
                name: atomicip-api-secrets
                optional: true
          env:
            # Internal metrics listener (#1207); scraped via the metrics port.
            - name: METRICS_PORT
              value: "9090"
            # Token required for /metrics scrapes (#1207).
            - name: METRICS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: atomicip-api-secrets
                  key: metrics-auth-token
                  optional: true
            # CORS allowlist per environment (#1204).
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: atomicip-api-config
                  key: cors-allowed-origins
                  optional: true
            # GraphQL depth/complexity limits (#1205).
            - name: GRAPHQL_MAX_DEPTH
              valueFrom:
                configMapKeyRef:
                  name: atomicip-api-config
                  key: graphql-max-depth
                  optional: true
            - name: GRAPHQL_MAX_COMPLEXITY
              valueFrom:
                configMapKeyRef:
                  name: atomicip-api-config
                  key: graphql-max-complexity
                  optional: true
            # Explicit introspection toggle (#1206); off outside development.
            - name: GRAPHQL_INTROSPECTION
              valueFrom:
                configMapKeyRef:
                  name: atomicip-api-config
                  key: graphql-introspection
                  optional: true
          # Right-sized requests are the main cost lever (#1067): requests
          # drive scheduling/bin-packing, limits only cap bursts.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atomicip-api
