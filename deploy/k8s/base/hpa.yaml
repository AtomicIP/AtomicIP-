# #1067: Auto-scaling for the api-server. Scales out on CPU/memory pressure and
# scales in conservatively so idle capacity is released without flapping.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atomicip-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atomicip-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      # Wait 5 minutes of sustained low load, then remove at most 1 pod/min.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
